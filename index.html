<script>
const firebaseConfig = {
  apiKey: "AIzaSyDnw0Q5EwHad7INVSghb4JCtdkrX9fDTX8",
  authDomain: "tab-munis.firebaseapp.com",
  databaseURL: "https://tab-munis-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tab-munis",
  storageBucket: "tab-munis.firebasestorage.app",
  messagingSenderId: "261830207638",
  appId: "1:261830207638:web:060b135796a2f7fc46bab7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const PIN_KEY = 'xodimlar-tabeli-pin';
let state = { employees: {}, attendance: {}, advances: {} };
let activeTab = 'employees';
let selectedEmp = null;
let showSettings = false;
const now = new Date();
let curYear = now.getFullYear();
let curMonth = now.getMonth() + 1;
let firebaseReady = { employe

es: false, attendance: false, advances: false };

const WD_NAMES = ["Yak","Dush","Sesh","Chor","Pay","Juma","Shan"];
const MONTH_NAMES = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];

function fmt(n) { n = Number(n) || 0; return Math.round(n).toLocaleString('en-US').replace(/,/g, ' '); }
function pad(n) { return String(n).padStart(2, '0'); }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function dateKey(y, m, d) { return ${y}-${pad(m)}-${pad(d)}; }
function cleanPhone(p) { return (p || '').replace(/[^0-9]/g, ''); }
function empList() { return Object.keys(state.employees).map(id => ({ id, ...state.employees[id] })); }

/* ---------------- PIN LOCK ---------------- */
function initLock() {
  const savedPin = localStorage.getItem(PIN_KEY);
  const title = document.getElementById('lockTitle');
  const subtitle = document.getElementById('lockSubtitle');
  const input = document.getElementById('pinInput');
  const err = document.getElementById('lockErr');
  const btn = document.getElementById('pinBtn');

  if (!savedPin) {
    title.textContent = "PIN o'rnating";
    subtitle.textContent = "Bu ilova ma'lumotlarini faqat siz o'zgartira olishingiz uchun 4 xonali PIN yarating";
    let step = 1;
    let firstPin = '';
    btn.onclick = () => {
      const val = input.value.trim();
      if (val.length !== 4 || !/^\d{4}$/.test(val)) { err.textContent = "4 ta raqam kiriting"; return; }
      if (step === 1) {
        firstPin = val;
        step = 2;
        input.value = '';
        err.textContent = '';
        subtitle.textContent = "PIN kodni tasdiqlash uchun qayta kiriting";
        return;
      }
      if (val !== firstPin) { err.textContent = "PIN mos kelmadi, qaytadan urinib ko'ring"; step = 1; input.value = ''; subtitle.textContent = "Bu ilova ma'lumotlarini faqat siz o'zgartira olishingiz uchun 4 xonali PIN yarating"; return; }
      localStorage.setItem(PIN_KEY, val);
      unlockApp();
    };
  } else {
    title.textContent = "PIN kiriting";
    subtitle.textContent = "Ma'lumotlarni himoya qilish uchun PIN kodni kiriting";
    btn.onclick = () => {
      const val = input.value.trim();
      if (val === savedPin) { unlockApp(); }
      else { err.textContent = "PIN noto'g'ri"; input.value = ''; }
    };
  }
}

function unlockApp() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  connectFirebase();
}

function changePin() {
  const oldPin = prompt("Joriy PIN kodni kiriting:");
  const savedPin = localStorage.getItem(PIN_KEY);
  if (oldPin !== savedPin) { alert("PIN noto'g'ri"); return; }
  const newPin = prompt("Yangi 4 xonali PIN kodni kiriting:");
  if (!newPin || !/^\d{4}$/.test(newPin)) { alert("PIN 4 ta raqamdan iborat bo'lishi kerak"); return; }
  localStorage.setItem(PIN_KEY, newPin);
  alert("PIN muvaffaqiyatli o'zgartirildi");
}

/* ---------------- FIREBASE SYNC ---------------- */
function connectFirebase() {
  const note = document.getElementById('saveNote');
  note.textContent = "Ulanmoqda...";

  db.ref('employees').on('value', (snap) => {
    state.employees = snap.val() || {};
    if (!selectedEmp) { const ids = Object.keys(state.employees); if (ids.length) selectedEmp = ids[0]; }
    firebaseReady.employees = true;
    note.textContent = "Ulandi ✓ (real vaqt)";
    render();
  });
  db.ref('attendance').on('value', (snap) => {
    state.attendance = snap.val() || {};
    firebaseReady.attendance = true;
    render();
  });
  db.ref('advances').on('value', (snap) => {
    state.advances = snap.val() || {};
    firebaseReady.advances = true;
    render();
  });
}

function switchTab(tab) {
  activeTab = tab;
  showSettings = false;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  render();
}

function changeMonth(delta) {
  curMonth += delta;
  if (curMonth > 12) { curMonth = 1; curYear++; }
  if (curMonth < 1) { curMonth = 12; curYear--; }
  render();
}

/* ---------------- EMPLOYEES ------

---------- */
function addEmployee() {
  const ref = db.ref('employees').push();
  ref.set({ name: "", salary: 0, normDays: 26, phone: "" });
  selectedEmp = ref.key;
}
function delEmployee(id) {
  if (!confirm("Bu xodimni va uning barcha ma'lumotlarini o'chirishni tasdiqlaysizmi?")) return;
  db.ref('employees/' + id).remove();
  db.ref('attendance/' + id).remove();
  const advToDel = Object.keys(state.advances).filter(k => state.advances[k].empId === id);
  advToDel.forEach(k => db.ref('advances/' + k).remove());
  if (selectedEmp === id) { const ids = Object.keys(state.employees).filter(i=>i!==id); selectedEmp = ids.length ? ids[0] : null; }
}
function updateEmp(id, field, value, isNumber) {
  const v = isNumber ? (parseFloat(value) || 0) : value;
  db.ref('employees/' + id).update({ [field]: v });
}

/* ---------------- ATTENDANCE ---------------- */
function cycleStatus(empId, key) {
  const cur = (state.attendance[empId] || {})[key];
  const order = [undefined, 'keldi', 'kelmadi', 'dam'];
  const idx = order.indexOf(cur);
  const next = order[(idx + 1) % order.length];
  const ref = db.ref(attendance/${empId}/${key});
  if (next === undefined) ref.remove(); else ref.set(next);
}

/* ---------------- ADVANCES ---------------- */
function addAdvance() {
  const dateInput = document.getElementById('advDate');
  const amtInput = document.getElementById('advAmt');
  const noteInput = document.getElementById('advNote');
  const date = dateInput.value || dateKey(curYear, curMonth, 1);
  const amount = parseFloat(amtInput.value) || 0;
  const note = noteInput.value || '';
  if (!selectedEmp || amount <= 0) return;
  db.ref('advances').push({ empId: selectedEmp, date, amount, note });
}
function delAdvance(id) {
  db.ref('advances/' + id).remove();
}

/* ---------------- CALC ---------------- */
function empMonthStats(empId, y, m) {
  const dim = daysInMonth(y, m);
  const att = state.attendance[empId] || {};
  let keldi = 0, kelmadi = 0, dam = 0;
  for (let d = 1; d <= dim; d++) {
    const st = att[dateKey(y, m, d)];
    if (st === 'keldi') keldi++;
    else if (st === 'kelmadi') kelmadi++;
    else if (st === 'dam') dam++;
  }
  const emp = state.employees[empId] || {};
  const normDays = emp.normDays || 26;
  const salary = emp.salary || 0;
  const kunlikStavka = normDays > 0 ? salary / normDays : 0;
  const ishlaganSumma = kunlikStavka * keldi;
  const advJami = Object.values(state.advances)
    .filter(a => a.empId === empId && a.date.startsWith(${y}-${pad(m)}))
    .reduce((s, a) => s + a.amount, 0);
  const qoldiq = ishlaganSumma - advJami;
  return { keldi, kelmadi, dam, kunlikStavka, ishlaganSumma, advJami, qoldiq, salary };
}

/* ---------------- SEND REPORT ---------------- */
function reportText(emp, st) {
  return Salom, ${emp.name}!\n${MONTH_NAMES[curMonth-1]} ${curYear} oyi uchun tabelingiz:\n +
    Ishlagan kunlar: ${st.keldi}\nOylik maosh: ${fmt(st.salary)} so'm\n +
    Olingan avans: ${fmt(st.advJami)} so'm\nOxirgi qoldiq (to'lov): ${fmt(st.qoldiq)} so'm;
}
function sendSms(empId) {
  const emp = state.employees[empId];
  const st = empMonthStats(empId, curYear, curMonth);
  const phone = cleanPhone(emp.phone);
  if (!phone) { alert("Avval xodimning telefon raqamini kiriting."); return; }
  const text = encodeURIComponent(reportText(emp, st));
  window.location.href = sms:${phone}?body=${text};
}
function sendWhatsapp(empId) {
  const emp = state.employees[empId];
  const st = empMonthStats(empId, curYear, curMonth);
  const phone = cleanPhone(emp.phone);
  if (!phone) { alert("Avval xodimning telefon raqamini kiriting."); return; }
  const text = encodeURIComponent(reportText(emp, st));
  window.open(https://wa.me/${phone}?text=${text}, '_blank');
}

/* ---------------- EXCEL EXPORT ---------------- */
function exportExcel() {
  const wb = XLSX.utils.book_new();
  const emps = empList();

  const empData = [["Ism", "Oylik maosh", "Ish kunlari me'yori", "Telefon"]];
  emps.forEach(e => empData.push([e.name, e.salary, e.normDays, e.phone || ""]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils

.aoa_to_sheet(empData), "Xodimlar");

  const dim = daysInMonth(curYear, curMonth);
  const attHeader = ["Ism"];
  for (let d = 1; d <= dim; d++) attHeader.push(String(d));
  const attData = [attHeader];
  emps.forEach(e => {
    const row = [e.name];
    const att = state.attendance[e.id] || {};
    for (let d = 1; d <= dim; d++) {
      const st = att[dateKey(curYear, curMonth, d)];
      row.push(st === 'keldi' ? 'K' : st === 'kelmadi' ? 'X' : st === 'dam' ? 'D' : '');
    }
    attData.push(row);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attData), "Davomat");

  const advData = [["Xodim", "Sana", "Summa", "Izoh"]];
  Object.values(state.advances)
    .filter(a => a.date.startsWith(${curYear}-${pad(curMonth)}))
    .forEach(a => {
      const emp = state.employees[a.empId];
      advData.push([emp ? emp.name : "", a.date, a.amount, a.note || ""]);
    });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(advData), "Avanslar");

  const repData = [["Ism", "Ishlagan kun", "Kelmagan kun", "Oylik maosh", "Kunlik stavka", "Ishlagan summa", "Avans", "Oxirgi qoldiq"]];
  emps.forEach(e => {
    const st = empMonthStats(e.id, curYear, curMonth);
    repData.push([e.name, st.keldi, st.kelmadi, st.salary, Math.round(st.kunlikStavka), Math.round(st.ishlaganSumma), st.advJami, Math.round(st.qoldiq)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(repData), "Hisobot");

  XLSX.writeFile(wb, Tabel_${MONTH_NAMES[curMonth-1]}_${curYear}.xlsx);
}

/* ---------------- RENDER ---------------- */
function render() {
  renderMonthBar();
  renderSummary();
  renderSettings();
  renderContent();
  renderAddBtn();
}

function renderMonthBar() {
  const holder = document.getElementById('monthBarHolder');
  if (activeTab === 'employees') { holder.innerHTML = ''; return; }
  holder.innerHTML = 
    <div class="month-bar">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="mlabel">${MONTH_NAMES[curMonth-1]} ${curYear}</div>
      <button onclick="changeMonth(1)">›</button>
    </div>;
}

function renderSettings() {
  const holder = document.getElementById('settingsHolder');
  if (!showSettings) { holder.innerHTML = ''; return; }
  holder.innerHTML = 
    <div class="settings-panel">
      <h3>🔒 Xavfsizlik</h3>
      <button class="add-btn" style="margin-top:0;" onclick="changePin()">PIN kodni o'zgartirish</button>
    </div>;
}

function renderSummary() {
  const summary = document.getElementById('summary');
  const emps = empList();
  if (activeTab === 'employees') {
    summary.innerHTML = 
      <div class="card"><div class="num">${emps.length}</div><div class="lbl">Jami xodimlar</div></div>
      <div class="card"><div class="num">${fmt(emps.reduce((s,e)=>s+(e.salary||0),0))}</div><div class="lbl">Jami oylik fond (so'm)</div></div>;
  } else if (activeTab === 'attendance') {
    if (!selectedEmp) { summary.innerHTML = ''; return; }
    const st = empMonthStats(selectedEmp, curYear, curMonth);
    summary.innerHTML = 
      <div class="card"><div class="num">${st.keldi}</div><div class="lbl">Keldi</div></div>
      <div class="card"><div class="num">${st.kelmadi}</div><div class="lbl">Kelmadi</div></div>
      <div class="card"><div class="num">${st.dam}</div><div class="lbl">Dam olish</div></div>;
  } else if (activeTab === 'advances') {
    if (!selectedEmp) { summary.innerHTML = ''; return; }
    const st = empMonthStats(selectedEmp, curYear, curMonth);
    summary.innerHTML = 
      <div class="card"><div class="num">${fmt(st.advJami)}</div><div class="lbl">Shu oy avans (so'm)</div></div>
      <div class="card"><div class="num">${fmt(st.qoldiq)}</div><div class="lbl">Joriy qoldiq (so'm)</div></div>;
  } else if (activeTab === 'report') {
    const totalPay = emps.reduce((s,e)=> s + empMonthStats(e.id, curYear, curMonth).ishlaganSumma, 0);
    const totalAdv = emps.reduce((s,e)=> s + empMonthStats(e.id, curYear, curMonth).advJami, 0);
    const totalLeft = totalPay - totalAdv;
    summary.innerHTML = `
      <div class="card"><div class="num">${fmt(totalPa

y)}</div><div class="lbl">Jami ishlangan (so'm)</div></div>
      <div class="card"><div class="num">${fmt(totalAdv)}</div><div class="lbl">Jami avans (so'm)</div></div>
      <div class="card"><div class="num">${fmt(totalLeft)}</div><div class="lbl">Jami to'lanadigan (so'm)</div></div>;
  }
}

function empSelectHtml() {
  const emps = empList();
  if (!emps.length) return <div class="empty">Avval "Xodimlar" bo'limida xodim qo'shing.</div>;
  return <select class="emp-select" onchange="selectedEmp = this.value; render();">
    ${emps.map(e => <option value="${e.id}" ${e.id===selectedEmp?'selected':''}>${e.name || 'Ism kiritilmagan'}</option>).join('')}
  </select>;
}

function renderContent() {
  const content = document.getElementById('content');
  const emps = empList();

  if (activeTab === 'employees') {
    if (!emps.length) {
      content.innerHTML = <div class="empty">Hali xodim yo'q.<br>"+ Yangi xodim" tugmasini bosing.</div>;
      return;
    }
    content.innerHTML = emps.map(e => 
      <div class="item">
        <div class="item-top">
          <input class="name" placeholder="Ism familiya" value="${e.name}" onchange="updateEmp('${e.id}','name',this.value,false)">
          <button class="del" onclick="delEmployee('${e.id}')">O'chirish</button>
        </div>
        <div class="field-grid">
          <div class="field"><label>Oylik maosh (so'm)</label><input type="number" value="${e.salary}" onchange="updateEmp('${e.id}','salary',this.value,true)"></div>
          <div class="field"><label>Ish kunlari me'yori</label><input type="number" value="${e.normDays}" onchange="updateEmp('${e.id}','normDays',this.value,true)"></div>
          <div class="field full"><label>Telefon raqami</label><input type="tel" placeholder="998901234567" value="${e.phone||''}" onchange="updateEmp('${e.id}','phone',this.value,false)"></div>
        </div>
      </div>).join('');
    return;
  }

  if (activeTab === 'attendance') {
    let html = empSelectHtml();
    if (selectedEmp) {
      const dim = daysInMonth(curYear, curMonth);
      const att = state.attendance[selectedEmp] || {};
      html += '<div>';
      for (let d = 1; d <= dim; d++) {
        const key = dateKey(curYear, curMonth, d);
        const wd = new Date(curYear, curMonth-1, d).getDay();
        const st = att[key];
        const isWeekend = wd === 0 || wd === 6;
        const cls = st || 'none';
        const label = st === 'keldi' ? 'Keldi' : st === 'kelmadi' ? 'Kelmadi' : st === 'dam' ? 'Dam olish' : "Belgilanmagan";
        html += <div class="day-row ${isWeekend ? 'weekend' : ''}">
          <div class="dinfo">${d}-kun <span class="wd">${WD_NAMES[wd]}</span></div>
          <button class="status-btn ${cls}" onclick="cycleStatus('${selectedEmp}', '${key}')">${label}</button>
        </div>;
      }
      html += '</div>';
    }
    content.innerHTML = html;
    return;
  }

  if (activeTab === 'advances') {
    let html = empSelectHtml();
    if (selectedEmp) {
      html += 
        <div class="adv-form">
          <input type="date" id="advDate" value="${dateKey(curYear, curMonth, Math.min(now.getDate(), daysInMonth(curYear,curMonth)))}">
          <input type="number" id="advAmt" placeholder="Summa (so'm)">
          <input type="text" id="advNote" placeholder="Izoh (ixtiyoriy)" style="grid-column: span 2;">
        </div>
        <button class="add-btn" style="margin-bottom:14px;" onclick="addAdvance()">+ Avans qo'shish</button>;
      const list = Object.keys(state.advances)
        .map(k => ({ id: k, ...state.advances[k] }))
        .filter(a => a.empId === selectedEmp)
        .sort((a,b) => b.date.localeCompare(a.date));
      if (!list.length) {
        html += <div class="empty">Hali avans yozuvi yo'q.</div>;
      } else {
        html += list.map(a => 
          <div class="adv-row">
            <div class="ainfo"><div>${a.note || 'Avans'}</div><div class="adate">${a.date}</div></div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="aamt">${fmt(a.amount)} so'm</div>
              <b

utton class="del" onclick="delAdvance('${a.id}')">✕</button>
            </div>
          </div>).join('');
      }
    }
    content.innerHTML = html;
    return;
  }

  if (activeTab === 'report') {
    if (!emps.length) {
      content.innerHTML = <div class="empty">Hali xodim yo'q.</div>;
      return;
    }
    content.innerHTML = <button class="solid-btn" onclick="exportExcel()">📥 Excel (.xlsx) ko'rinishida yuklab olish</button> +
      emps.map(e => {
        const st = empMonthStats(e.id, curYear, curMonth);
        const hasPhone = !!cleanPhone(e.phone);
        return 
          <div class="rep-card">
            <div class="rep-name">${e.name || 'Ism kiritilmagan'}</div>
            <div class="rep-phone">${e.phone ? '📞 ' + e.phone : 'Telefon raqami kiritilmagan'}</div>
            <div class="rep-grid">
              <div class="rlbl">Ishlagan kunlar</div><div class="rval">${st.keldi} kun</div>
              <div class="rlbl">Kelmagan kunlar</div><div class="rval">${st.kelmadi} kun</div>
              <div class="rlbl">Oylik maosh</div><div class="rval">${fmt(st.salary)} so'm</div>
              <div class="rlbl">Kunlik stavka</div><div class="rval">${fmt(st.kunlikStavka)} so'm</div>
              <div class="rlbl">Ishlagan summa</div><div class="rval">${fmt(st.ishlaganSumma)} so'm</div>
              <div class="rlbl">Olgan avans</div><div class="rval">${fmt(st.advJami)} so'm</div>
            </div>
            <div class="rep-final">
              <div class="flbl">OXIRGI QOLDIQ</div>
              <div class="fval">${fmt(st.qoldiq)} so'm</div>
            </div>
            <div class="send-row">
              <button class="send-btn sms ${hasPhone?'':'disabled'}" onclick="sendSms('${e.id}')">💬 SMS yuborish</button>
              <button class="send-btn wa ${hasPhone?'':'disabled'}" onclick="sendWhatsapp('${e.id}')">🟢 WhatsApp</button>
            </div>
          </div>;
      }).join('');
  }
}

function renderAddBtn() {
  const holder = document.getElementById('addBtnHolder');
  if (activeTab === 'employees') {
    holder.innerHTML = <button class="add-btn" id="addBtn">+ Yangi xodim</button>`;
    document.getElementById('addBtn').addEventListener('click', addEmployee);
  } else {
    holder.innerHTML = '';
  }
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
document.getElementById('settingsBtn').addEventListener('click', () => { showSettings = !showSettings; renderSettings(); });

initLock();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
